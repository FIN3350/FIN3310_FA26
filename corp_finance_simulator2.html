<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridgeline Finance Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --paper: #f5f6f4;
  --paper-2: #ffffff;
  --paper-3: #eaeeeb;
  --rule: #cfd6d1;
  --rule-soft: #e1e6e2;
  --ink: #16211c;
  --ink-2: #4b5852;
  --ink-3: #7b8781;
  --ledger: #1f7a54;
  --ledger-ink: #ffffff;
  --ledger-tint: #e3f1ea;
  --copper: #a45c22;
  --copper-tint: #f6e9de;
  --good: #1f7a54;
  --warn: #b7791f;
  --crit: #b3372f;
  --crit-tint: #f8e5e3;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --focus: #2a78d6;
  --shadow: 0 1px 2px rgba(22, 33, 28, .08), 0 8px 24px rgba(22, 33, 28, .06);
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #131917; --paper-2: #1b2320; --paper-3: #232d29; --rule: #34423c; --rule-soft: #2a3631;
    --ink: #eef3f0; --ink-2: #b7c2bc; --ink-3: #85938c;
    --ledger: #3fae7f; --ledger-ink: #0e1512; --ledger-tint: #1c3328;
    --copper: #d7884a; --copper-tint: #3a2a1d;
    --good: #3fae7f; --warn: #d9a441; --crit: #e07068; --crit-tint: #3d2422;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --focus: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #131917; --paper-2: #1b2320; --paper-3: #232d29; --rule: #34423c; --rule-soft: #2a3631;
  --ink: #eef3f0; --ink-2: #b7c2bc; --ink-3: #85938c;
  --ledger: #3fae7f; --ledger-ink: #0e1512; --ledger-tint: #1c3328;
  --copper: #d7884a; --copper-tint: #3a2a1d;
  --good: #3fae7f; --warn: #d9a441; --crit: #e07068; --crit-tint: #3d2422;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --focus: #3987e5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; letter-spacing: -.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; line-height: 1.15; }
h2 { font-size: 1.45rem; line-height: 1.2; }
h3 { font-size: 1.1rem; }
h4 { margin: 1rem 0 .35rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
p { margin: 0 0 .8rem; max-width: 68ch; }
a { color: var(--ledger); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, td, .cfstrip b, .stat-value, .ledger-line b { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---- frame ---- */
.frame { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--paper-2); border-right: 1px solid var(--rule); padding: 1.25rem 1rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
.brand { padding: .25rem .5rem .75rem; border-bottom: 1px solid var(--rule-soft); }
.brand .eyebrow { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.brand h1 { font-size: 1.4rem; margin-top: .15rem; }
.brand .course { font-size: .8rem; color: var(--ink-2); margin-top: .25rem; }
.student { display: flex; flex-direction: column; gap: .3rem; padding: 0 .5rem; }
.student label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.student input { padding: .45rem .6rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); }
nav { display: flex; flex-direction: column; gap: .15rem; }
nav .group { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: .8rem .5rem .3rem; }
nav button { display: grid; grid-template-columns: 2.6rem 1fr auto; align-items: center; gap: .5rem; width: 100%; text-align: left; background: none; border: 0; padding: .45rem .5rem; border-radius: 6px; cursor: pointer; color: var(--ink-2); }
nav button:hover { background: var(--paper-3); }
nav button.active { background: var(--ledger-tint); color: var(--ink); }
nav button .ch { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
nav button .t { font-size: .88rem; line-height: 1.25; }
nav button .dot { width: .6rem; height: .6rem; border-radius: 50%; border: 1.5px solid var(--rule); }
nav button .dot.done { background: var(--good); border-color: var(--good); }
nav button .dot.part { background: linear-gradient(90deg, var(--good) 50%, transparent 50%); border-color: var(--good); }
.side .foot { margin-top: auto; font-size: .75rem; color: var(--ink-3); padding: 0 .5rem; }
.side .foot button { background: none; border: 0; color: var(--ink-3); text-decoration: underline; cursor: pointer; padding: 0; }
.main { padding: 2rem 2.5rem 4rem; max-width: 1100px; width: 100%; min-width: 0; }
.btn.menu-toggle { display: none; }
@media (max-width: 900px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 20; width: 272px; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; box-shadow: var(--shadow); }
  .main { padding: 1.25rem 1rem 3rem; }
  .btn.menu-toggle { display: inline-flex; margin-bottom: 1rem; }
}

/* ---- page header ---- */
.pagehead { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--rule); }
.pagehead .eyebrow { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ledger); font-weight: 600; display: flex; gap: .75rem; }
.pagehead .eyebrow span + span { color: var(--ink-3); }
.pagehead .firm { color: var(--ink-2); font-size: .9rem; }

/* ---- blocks ---- */
.panel { background: var(--paper-2); border: 1px solid var(--rule-soft); border-radius: 8px; padding: 1.25rem 1.4rem; margin-bottom: 1.25rem; }
.panel.tint { background: var(--ledger-tint); border-color: transparent; }
.panel.copper { background: var(--copper-tint); border-color: transparent; }
.panel h3 { margin-bottom: .6rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
table.fin { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.fin caption { text-align: left; font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 0 0 .4rem; }
table.fin th { text-align: left; font-weight: 400; color: var(--ink-2); padding: .22rem .4rem .22rem 0; border-bottom: 1px solid var(--rule-soft); }
table.fin td { text-align: right; padding: .22rem 0 .22rem .4rem; border-bottom: 1px solid var(--rule-soft); }
table.fin tr.sub th, table.fin tr.sub td { font-weight: 600; }
table.fin tr.tot th, table.fin tr.tot td { font-weight: 600; border-top: 2px solid var(--rule); border-bottom: 0; }
table.fin.small { margin-top: 1rem; }
table.fin.small th { width: 25%; }
.facts { margin: 0; padding-left: 1.1rem; }
.facts li { margin: .25rem 0; }
.cfstrip { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .5rem; }
.cfstrip div { border: 1px solid var(--rule); border-radius: 6px; padding: .4rem .7rem; min-width: 5.5rem; background: var(--paper); }
.cfstrip span { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.cfstrip b { font-weight: 500; }
.wide { overflow-x: auto; }

/* ---- questions ---- */
.qlist { display: grid; gap: .6rem; }
.q { display: grid; grid-template-columns: 1fr 12rem 6rem; gap: .75rem; align-items: center; padding: .55rem .75rem; border-radius: 6px; background: var(--paper); border: 1px solid var(--rule-soft); }
.q label { font-size: .92rem; }
.q .in { display: flex; align-items: center; gap: .4rem; }
.q input { width: 100%; padding: .4rem .5rem; border: 1px solid var(--rule); border-radius: 5px; background: var(--paper-2); font-family: var(--mono); text-align: right; }
.q .unit { font-size: .75rem; color: var(--ink-3); white-space: nowrap; }
.q .mark { font-size: .78rem; font-weight: 600; text-align: right; }
.q.ok { border-color: var(--good); }
.q.ok .mark { color: var(--good); }
.q.bad { border-color: var(--crit); }
.q.bad .mark { color: var(--crit); }
.q .sol { grid-column: 1 / -1; font-size: .85rem; color: var(--ink-2); border-top: 1px dashed var(--rule); padding-top: .4rem; }
@media (max-width: 760px) { .q { grid-template-columns: 1fr; } .q .mark { text-align: left; } }
.mcq { padding: .75rem; border-radius: 6px; background: var(--paper); border: 1px solid var(--rule-soft); margin-bottom: .6rem; }
.mcq p { font-weight: 500; margin-bottom: .5rem; }
.mcq .opts { display: grid; gap: .35rem; }
.mcq .opts label { display: flex; gap: .55rem; align-items: flex-start; padding: .4rem .6rem; border-radius: 5px; border: 1px solid transparent; cursor: pointer; }
.mcq .opts label:hover { background: var(--paper-3); }
.mcq .opts label.correct { border-color: var(--good); background: var(--ledger-tint); }
.mcq .opts label.wrong { border-color: var(--crit); background: var(--crit-tint); }
.mcq .fb { margin-top: .5rem; font-size: .88rem; color: var(--ink-2); }
.reflect textarea, .rationale textarea { width: 100%; min-height: 5rem; padding: .6rem .7rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); resize: vertical; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-top: 1rem; }
.btn { display: inline-flex; align-items: center; gap: .4rem; padding: .55rem 1rem; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper-2); cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--paper-3); }
.btn.primary { background: var(--ledger); color: var(--ledger-ink); border-color: var(--ledger); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.note { font-size: .85rem; color: var(--ink-2); }
.badge { display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: .15rem .5rem; border-radius: 999px; background: var(--paper-3); color: var(--ink-2); }
.badge.good { background: var(--ledger-tint); color: var(--good); }
.badge.crit { background: var(--crit-tint); color: var(--crit); }
.badge.warn { background: var(--copper-tint); color: var(--copper); }

/* ---- stat tiles ---- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; margin-bottom: 1.25rem; }
.stat { background: var(--paper-2); border: 1px solid var(--rule-soft); border-radius: 8px; padding: .8rem .95rem; }
.stat .stat-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.stat .stat-value { font-size: 1.45rem; font-weight: 500; line-height: 1.2; margin-top: .2rem; }
.stat .stat-sub { font-size: .78rem; color: var(--ink-2); margin-top: .15rem; }
.stat.up .stat-value { color: var(--good); }
.stat.down .stat-value { color: var(--crit); }

/* ---- capstone ---- */
.yearbar { display: flex; gap: .4rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
.yearbar div { flex: 1; min-width: 6rem; padding: .5rem .7rem; border-radius: 6px; border: 1px solid var(--rule-soft); background: var(--paper-2); font-size: .8rem; color: var(--ink-3); }
.yearbar div b { display: block; color: var(--ink); font-weight: 500; font-family: var(--mono); font-size: .85rem; }
.yearbar div.now { border-color: var(--ledger); background: var(--ledger-tint); }
.yearbar div.done { color: var(--ink-2); }
.event { border-left: 4px solid var(--copper); padding-left: 1rem; }
.projects { width: 100%; border-collapse: collapse; font-size: .88rem; }
.projects th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: .4rem .5rem; border-bottom: 1px solid var(--rule); }
.projects td { padding: .55rem .5rem; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
.projects td.name { font-family: var(--body); }
.projects td.name small { display: block; color: var(--ink-3); }
.projects .flows { font-size: .78rem; color: var(--ink-2); }
.projects input[type=checkbox] { width: 1.1rem; height: 1.1rem; accent-color: var(--ledger); }
.projects tr.chosen td { background: var(--ledger-tint); }
.decide { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.field { display: flex; flex-direction: column; gap: .3rem; }
.field label { font-size: .78rem; font-weight: 600; color: var(--ink-2); }
.field input, .field select { padding: .45rem .6rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); font-family: var(--mono); }
.field select { font-family: var(--body); }
.field small { color: var(--ink-3); font-size: .75rem; }
.calc { display: grid; grid-template-columns: 1fr auto; gap: .75rem; align-items: end; }
.calc input { width: 100%; padding: .45rem .6rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); font-family: var(--mono); }
.calc-out { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-top: .6rem; font-size: .9rem; }
.calc-out span { color: var(--ink-3); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; display: block; }
.ledger-line { display: flex; justify-content: space-between; padding: .2rem 0; border-bottom: 1px solid var(--rule-soft); font-size: .88rem; }
.ledger-line.tot { font-weight: 600; border-top: 2px solid var(--rule); border-bottom: 0; }
.ledger-line b { font-weight: 500; }
.notes li { margin: .2rem 0; }

/* ---- charts ---- */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid line { stroke: var(--rule-soft); }
.chart .axis text { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }
.chart .axis line { stroke: var(--rule); }
.chart .s1 { stroke: var(--series-1); }
.chart .s2 { stroke: var(--series-2); }
.chart .s1f { fill: var(--series-1); }
.chart .s2f { fill: var(--series-2); }
.chart .lbl { fill: var(--ink-2); font-size: 11px; font-family: var(--body); }
.chart .bar-pos { fill: var(--series-1); }
.chart .bar-neg { fill: var(--series-2); }
.chart .bar-avail { fill: none; stroke: var(--ink-3); stroke-dasharray: 3 3; }
.legend { display: flex; gap: 1rem; font-size: .8rem; color: var(--ink-2); margin-bottom: .4rem; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: .35rem; border-radius: 2px; }
.legend i.s1 { background: var(--series-1); }
.legend i.s2 { background: var(--series-2); }
.legend i.box { height: 10px; border: 1px dashed var(--ink-3); background: none; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); padding: .35rem .55rem; border-radius: 5px; font-size: .75rem; font-family: var(--mono); white-space: nowrap; transform: translate(-50%, -120%); display: none; }
.hit { fill: transparent; }

/* ---- debrief ---- */
.report { width: 100%; min-height: 16rem; font-family: var(--mono); font-size: .78rem; padding: .75rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); white-space: pre; overflow: auto; }
.log { font-size: .85rem; }
.log .entry { padding: .5rem 0; border-bottom: 1px solid var(--rule-soft); display: grid; grid-template-columns: 5.5rem 1fr; gap: .75rem; }
.log .when { font-family: var(--mono); color: var(--ink-3); font-size: .75rem; }
.verdict { padding: .6rem .8rem; border-radius: 6px; border: 1px solid var(--rule-soft); background: var(--paper); margin: .4rem 0; font-size: .9rem; }
.verdict.miss { border-left: 3px solid var(--copper); }
.verdict.hit { border-left: 3px solid var(--good); }
.home-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.home-steps .panel { margin: 0; }
.home-steps .k { font-family: var(--display); font-size: 1.6rem; color: var(--ledger); line-height: 1; margin-bottom: .4rem; }
@media (max-width: 760px) { .home-steps, .decide, .calc { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print { .side, .actions, .menu-toggle { display: none; } .frame { display: block; } .main { max-width: none; padding: 0; } }


/* ---- primers, how-to, review ---- */
.kicker { display: block; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ledger); font-weight: 600; margin-bottom: .2rem; }
details.panel > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 1rem; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary .kicker { grid-column: 1 / -1; }
details.panel > summary h3 { margin: 0; }
details.panel > summary::after { content: "Show"; grid-row: 2; grid-column: 2; font-size: .78rem; font-weight: 600; color: var(--ledger); padding: .2rem .6rem; border: 1px solid var(--ledger); border-radius: 999px; }
details.panel[open] > summary::after { content: "Hide"; }
.primer-body, .howto-body { margin-top: .9rem; }
.primer-body p, .howto-body p { max-width: 72ch; }
dl.formulas { display: grid; grid-template-columns: minmax(10rem, 15rem) 1fr; gap: .4rem 1.25rem; margin: 0; padding: .7rem .9rem; background: var(--paper-2); border-radius: 6px; }
dl.formulas dt { color: var(--ink-2); font-size: .86rem; }
dl.formulas dd { margin: 0; font-family: var(--mono); font-size: .82rem; }
@media (max-width: 760px) { dl.formulas { grid-template-columns: 1fr; } dl.formulas dd { margin-bottom: .45rem; } }
.example { margin-top: 1rem; padding: .9rem 1rem; background: var(--paper-2); border: 1px solid var(--rule-soft); border-radius: 6px; }
.example .ex-title { margin: .1rem 0 .4rem; text-transform: none; letter-spacing: 0; font-size: .95rem; color: var(--ink); font-family: var(--display); font-weight: 500; }
.example-setup { color: var(--ink-2); font-size: .9rem; }
.example code { display: inline-block; font-family: var(--mono); font-size: .9rem; padding: .3rem .6rem; background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; margin-bottom: .6rem; }
ol.worked, ul.keys, ul.mistakes, ol.howto-steps, ol.howto-steps ul { margin: 0; padding-left: 1.25rem; }
ol.worked li, ul.keys li, ul.mistakes li { margin: .3rem 0; max-width: 74ch; }
ol.howto-steps > li { margin: .55rem 0; max-width: 78ch; }
ol.howto-steps ul li { margin: .3rem 0; }
ul.keys li { font-family: var(--mono); font-size: .8rem; }
.btn.small { padding: .25rem .65rem; font-size: .8rem; }
.projects .evald { display: block; margin-top: .3rem; }
.projects .flows { font-family: var(--mono); white-space: nowrap; }
.sel-sum { display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; margin-top: .8rem; font-size: .86rem; padding: .6rem .8rem; background: var(--paper); border-radius: 6px; border: 1px solid var(--rule-soft); color: var(--ink-2); }
.sel-sum b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.sel-sum b.neg, .cashplan .neg b { color: var(--crit); }
.calcbox { margin-top: 1.1rem; padding-top: .4rem; border-top: 1px solid var(--rule-soft); }
.calc { grid-template-columns: 1fr auto auto; }
.calc-out { align-items: flex-end; }
.calc-out p { width: 100%; margin: 0; }
.warn-text { color: var(--copper); }
.muted { color: var(--ink-3); }
.modal[hidden] { display: none; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(9, 14, 12, .55); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 1rem; overflow-y: auto; }
.modal-card { background: var(--paper-2); color: var(--ink); border-radius: 10px; box-shadow: var(--shadow); width: min(780px, 100%); padding: 1.5rem 1.6rem 1.25rem; }
.modal-card h2 { margin-bottom: .35rem; }
.cashplan { max-width: 520px; }
.memo-quote { white-space: pre-wrap; background: var(--paper); border: 1px solid var(--rule-soft); border-radius: 6px; padding: .7rem .85rem; font-size: .9rem; }

  function annuityPV(pmt, r, n) { return r === 0 ? pmt * n : pmt * (1 - Math.pow(1 + r, -n)) / r; }

  function ear(apr, m) { return Math.pow(1 + apr / m, m) - 1; }

  function irr(cfs) {
    var lo = -0.99, hi = 10, f = function (r) { return npv(r, cfs); };
    if (f(lo) * f(hi) > 0) return NaN;
    for (var i = 0; i < 200; i++) { var mid = (lo + hi) / 2; if (f(lo) * f(mid) <= 0) hi = mid; else lo = mid; }

    projects: {

        { id: 'P1B', name: 'Flagship downtown store', cost: 2400, life: 5, ocf: 560, salvage: 300, note: 'High visibility, high rent.' },
        { id: 'P1C', name: 'Quick-hit ad blitz', cost: 300, life: 2, ocf: 190, salvage: 0, note: 'Fast payback, short life.' }

    s.sales = baseSales; // trend carries forward without policy effects
    var cogs = sales * s.cogsPct;
    var carry = sales * iv.carry;
    var badDebt = sales * cr.badDebt;
    var baseDep = s.gfa * CAP.depRate;
    var projectOCF = 0, projectSalvage = 0, projectDep = 0;
    s.activeProjects.forEach(function (p) {

    var de = totalDebt / Math.max(equity, 1);

    var v = valuation(s, coreNOPAT, de, curRatio, yr);

    var pe = s.price / Math.max(eps, 0.01);

      dso: cr.days, dio: iv.days, projectValue: log.projectValue, accepted: log.accepted, notes: log.notes, decision: decision,

  }
  /* Market value of equity = core after-tax operating profit / (r - g)
     + PV of remaining cash flows on projects already under way
     + cash - debt.  r rises with market rates, leverage and weak liquidity. */
  function valuation(s, coreNOPAT, de, curRatio, yr) {
    var r = CAP.requiredReturn + 0.5 * (s.rate - CAP.baseRate);
    if (de > 0.8) r += 0.03 * Math.min(de - 0.8, 4);
    if (s.paidIn + s.retained <= 0) r += 0.05;

  function fmt0(x) { return Math.round(x).toLocaleString('en-US'); }
  function pct(x, d) { return (x * 100).toFixed(d == null ? 1 : d) + '%'; }

  function finalScore(state) {

      '<li><b>Decision rule:</b> accept every project with a positive NPV, and only those. IRR, payback and PI are shown for comparison; when they disagree with NPV, follow NPV.</li></ul>' +
      '<div class="example"><div class="kicker">Worked example (not on this year’s menu)</div><p>A machine costs $1,000K, brings in $300K a year for 4 years, and is sold for $100K at the end. Year 4’s flow is 300 + 100 = 400, so you type:</p><code>' + flowsText(ex) + '</code><p>At 10% the calculator shows NPV <b>' + fmt(FS.npv(0.10, ex), 2) + '</b> and IRR <b>' + pct(FS.irr(ex), 2) + '</b>. NPV is positive, so the machine adds value: accept. On a BA II Plus: CF0 = −1000, C01 = 300 with F01 = 3, C02 = 400, then NPV at I = 10.</p></div></li>' +
      '<li><b>Make sure you can pay for what you accept.</b> Projects are paid for in cash at the start of the year. Compare their total cost with your cash on hand (' + k(st.cash) + ' now). If you are short, issue bonds or stock to cover the gap plus a cushion of roughly $500K, because dividends and working capital also use cash. Otherwise the bank lends the shortfall at the market rate plus 3 points.</li>' +
      '<li><b>Set working-capital and dividend policy.</b> Credit terms and inventory policy change sales and how much cash is tied up in receivables and stock. The dividend is paid on every share at year-end.</li>' +
      '<li><b>Write your memo, then review.</b> Explain what you chose and why. “Review my decisions” shows everything on one screen and flags anything that does not match your memo before you close the year.</li>' +
      '</ol></div></details>';
  }

  function renderCapstone() {
    var g = state.game, st = g.state, yr = st.year + 1;
    var last = st.history[st.history.length - 1];
    var html = '<div class="pagehead"><div class="eyebrow"><span>Capstone</span><span>CSLO 2 · 3 · 4 · 5 · 6</span></div><h1>Ridgeline Outfitters</h1><div class="firm">A regional outdoor-gear retailer. You are the CFO. Amounts in thousands of dollars; 1,000K shares outstanding at the start; required return on projects 10%; tax rate 21%.</div></div>';
    html += '<div class="yearbar">' + FS.CAP.events.map(function (e) { return '<div class="' + (e.year < yr ? 'done' : e.year === yr ? 'now' : '') + '">Year ' + e.year + '<b>' + esc(e.title) + '</b></div>'; }).join('') + '</div>';
    html += '<div class="stats">' + tile('Share price', money(st.price, 2), last ? 'was ' + money(st.openingPrice, 2) + ' at start' : 'opening price') + tile('Cash', k(st.cash), 'available now') + tile('Long-term debt', k(st.ltd), 'at ' + pct(st.debtRate) + ' average') + tile('Market rate', pct(st.rate), 'cost of new debt') + tile('Dividends paid', money(st.cumDiv, 2) + '/sh', 'cumulative') + '</div>';

    if (st.year >= 5) {
      html += '<div class="panel tint"><h3>Five years are in the books.</h3><p>Your final share price is ' + money(st.price, 2) + ' against an opening price of ' + money(st.openingPrice, 2) + ', plus ' + money(st.cumDiv, 2) + ' per share of dividends. Head to the debrief to see what created — and destroyed — value.</p><div class="actions"><button class="btn primary" id="toDebrief">Open the debrief</button></div></div>';
      html += '<div class="panel">' + statements(last) + '</div>';
      main.innerHTML = html; $('#toDebrief').onclick = function () { go('debrief'); }; return;
    }

    if (!g.draft || g.draft.year !== yr) g.draft = { year: yr, accept: [], bonds: '0', stock: '0', repay: '0', dps: '0.50', credit: 'net45', inventory: 'normal', why: '', runs: [], reviews: 0, cf: '', rate: '10' };
    var dr = g.draft;
    var menu = FS.CAP.projects[yr];
    var howOpen = yr === 1 ? g.howtoOpen !== false : g.howtoOpen === true;
    html += howToHTML(st, howOpen);

    var ev = FS.CAP.events[yr - 1];
    html += '<div class="panel event"><div class="kicker" style="color:var(--copper)">Year ' + yr + ' outlook</div><h3>' + esc(ev.title) + '</h3><p>' + esc(ev.text) + '</p>' + (yr === 1 ? '<p class="note">Last year Ridgeline sold ' + k(10250) + ', earned about ' + k(948) + ' after tax, and paid $0.50 a share in dividends. The core business grows about 3% a year on its own.</p>' : '') + '</div>';
    if (last) html += '<div class="panel"><h3>Last year’s results</h3>' + (last.notes.length ? '<ul class="notes">' + last.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '') + statements(last) + '</div>';

    // projects
    html += '<div class="panel"><h3>Step 2 · This year’s project proposals</h3><p class="note">Three independent proposals. Evaluate each one separately at 10%, then tick the ones you accept. Each cost is paid now; operating cash flows arrive at the end of each year; salvage (already after tax) arrives with the last one.</p><div class="wide"><table class="projects"><tr><th>Accept</th><th>Project</th><th>Cost</th><th>Annual OCF</th><th>Life</th><th>Salvage</th><th>Cash flows to enter</th><th></th></tr>';
    menu.forEach(function (p) {
      var cfs = FS.projectCFs(p), chosen = dr.accept.indexOf(p.id) >= 0;
      html += '<tr data-p="' + p.id + '" class="' + (chosen ? 'chosen' : '') + '"><td><input type="checkbox" class="acc" value="' + p.id + '" aria-label="Accept ' + esc(p.name) + '"' + (chosen ? ' checked' : '') + '></td><td class="name">' + esc(p.name) + '<small>' + esc(p.note) + '</small><span class="evald" data-ev="' + p.id + '"></span></td><td>' + k(p.cost) + '</td><td>' + k(p.ocf) + '</td><td>' + p.life + ' yrs</td><td>' + k(p.salvage) + '</td><td class="flows">' + esc(flowsText(cfs)) + '</td><td><button class="btn small load" data-load="' + p.id + '">Load</button></td></tr>';
    });
    html += '</table></div><div class="sel-sum" id="selSum"></div>';
    html += '<div class="calcbox"><h4>Cash-flow calculator</h4><div class="calc"><div class="field"><label for="cfIn">Cash flows for <i>one</i> project: year 0 first (negative), separated by commas</label><input id="cfIn" placeholder="e.g. ' + flowsText(EXAMPLE_CF) + '" value="' + esc(dr.cf) + '"></div><div class="field"><label for="rIn">Rate %</label><input id="rIn" value="' + esc(dr.rate) + '" style="width:6rem"></div><button class="btn primary" id="calcBtn">Calculate</button></div><div class="calc-out" id="calcOut"></div><div id="runs"></div></div></div>';

    // financing & policy
    var opt = function (v, cur, label) { return '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + label + '</option>'; };
    html += '<div class="panel"><h3>Steps 3–4 · Financing and policy</h3><div class="decide">' +
      '<div class="field"><label for="bonds">Issue bonds ($000)</label><input id="bonds" inputmode="decimal" value="' + esc(dr.bonds) + '"><small>10-year bonds at today’s market rate of ' + pct(st.rate) + '. Interest is tax-deductible; more debt raises leverage risk.</small></div>' +
      '<div class="field"><label for="stock">Issue new stock ($000)</label><input id="stock" inputmode="decimal" value="' + esc(dr.stock) + '"><small>Sold at ' + money(st.price * 0.95, 2) + ' per share after a 5% flotation cost. Dilutes existing holders.</small></div>' +
      '<div class="field"><label for="repay">Repay long-term debt ($000)</label><input id="repay" inputmode="decimal" value="' + esc(dr.repay) + '"><small>Uses cash on hand. Cuts interest and leverage.</small></div>' +
      '<div class="field"><label for="dps">Dividend per share ($)</label><input id="dps" inputmode="decimal" value="' + esc(dr.dps) + '"><small>Paid at year-end on all shares. Cash you pay out cannot fund projects.</small></div>' +
      '<div class="field"><label for="credit">Credit terms to customers</label><select id="credit">' + opt('net30', dr.credit, 'Net 30 — strict: no sales lift, 0.3% bad debt, 30 days of receivables') + opt('net45', dr.credit, 'Net 45 — standard: +2.5% sales, 0.6% bad debt, 45 days') + opt('net60', dr.credit, 'Net 60 — generous: +4% sales, 1.2% bad debt, 60 days') + '</select></div>' +
      '<div class="field"><label for="inventory">Inventory policy</label><select id="inventory">' + opt('lean', dr.inventory, 'Lean — 30 days of stock, lose 3% of sales to stockouts') + opt('normal', dr.inventory, 'Normal — 55 days of stock') + opt('heavy', dr.inventory, 'Heavy — 80 days of stock, 1% of sales in carrying cost') + '</select></div>' +
      '</div><p class="note" style="margin-top:.8rem">If cash runs out during the year the bank lends automatically at the market rate plus 3 points (' + pct(st.rate + 0.03) + ' this year).</p></div>';

    html += '<div class="panel rationale"><h3>Step 5 · Your memo to the CEO</h3><p class="note">Which projects you accepted and why (cite the NPVs), how you are paying for them, your credit, inventory and dividend choices, and what you expect this year’s event to do. This is the part you will analyze later.</p><textarea id="why" placeholder="At least a few sentences.">' + esc(dr.why) + '</textarea><div class="actions"><button class="btn primary" id="reviewBtn">Review my decisions</button><span class="note" id="closeNote">Nothing is final until you confirm on the review screen. Your choices are saved as you go.</span></div></div>';
    html += '<div class="modal" id="reviewModal" hidden role="dialog" aria-modal="true" aria-labelledby="reviewTitle"><div class="modal-card" id="reviewCard"></div></div>';
    main.innerHTML = html;

    // ---- wiring ----
    function readDraft() {
      dr.accept = Array.prototype.map.call(main.querySelectorAll('.acc:checked'), function (c) { return c.value; });
      ['bonds', 'stock', 'repay', 'dps'].forEach(function (f) { dr[f] = $('#' + f).value; });
      dr.credit = $('#credit').value; dr.inventory = $('#inventory').value; dr.why = $('#why').value;
      dr.cf = $('#cfIn').value; dr.rate = $('#rIn').value;
    }
    function persist() { readDraft(); save(); updateSummary(); }
    main.querySelectorAll('input, select, textarea').forEach(function (el) { if (el.closest('#reviewModal')) return; el.addEventListener('input', persist); el.addEventListener('change', persist); });
    main.querySelectorAll('.acc').forEach(function (c) { c.addEventListener('change', function () { c.closest('tr').classList.toggle('chosen', c.checked); }); });
    // record only the student's own clicks (browsers also fire 'toggle' on first render)
    $('#howto summary').addEventListener('click', function () { setTimeout(function () { g.howtoOpen = $('#howto').open; save(); }, 0); });

    function runFor(p) { var cfs = FS.projectCFs(p); return dr.runs.filter(function (r) { return Math.abs(r.r - 0.10) < 1e-9 && sameFlows(r.cfs, cfs); })[0]; }
    function updateSummary() {
      var chosen = menu.filter(function (p) { return dr.accept.indexOf(p.id) >= 0; });
      var cost = chosen.reduce(function (a, p) { return a + p.cost; }, 0);
      var b = parseNum(dr.bonds), s = parseNum(dr.stock), rp = parseNum(dr.repay);
      var fin = (isNaN(b) ? 0 : b) + (isNaN(s) ? 0 : s) - (isNaN(rp) ? 0 : rp);
      var after = st.cash + fin - cost;
      $('#selSum').innerHTML = '<span>Accepted: <b>' + (chosen.length ? chosen.map(function (p) { return p.id; }).join(', ') : 'none') + '</b></span><span>Total cost <b>' + k(cost) + '</b></span><span>Cash now <b>' + k(st.cash) + '</b></span><span>Net financing <b>' + (fin >= 0 ? '+' : '') + k(fin) + '</b></span><span>Cash after projects <b class="' + (after < 0 ? 'neg' : '') + '">' + k(after) + '</b></span>';
      menu.forEach(function (p) {
        var r = runFor(p), el = main.querySelector('[data-ev="' + p.id + '"]');
        el.innerHTML = r ? '<span class="badge good">Evaluated · NPV ' + fmt(r.npv, 2) + '</span>' : '<span class="badge">Not evaluated yet</span>';
      });
    }
    function renderRuns() {
      var out = $('#runs');
      if (!dr.runs.length) { out.innerHTML = ''; return; }
      out.innerHTML = '<h4>Your calculations this year</h4><div class="wide"><table class="fin runs"><tr><th>Project</th><td>Rate</td><td>NPV</td><td>IRR</td><td>Payback</td><td>PI</td></tr>' + dr.runs.map(function (r) {
        var p = menu.filter(function (q) { return sameFlows(FS.projectCFs(q), r.cfs); })[0];
        return '<tr><th>' + (p ? p.id + ' ' + esc(p.name) : 'Custom: ' + esc(flowsText(r.cfs))) + '</th><td>' + pct(r.r, 1) + '</td><td>' + fmt(r.npv, 2) + '</td><td>' + (isNaN(r.irr) ? 'n/a' : pct(r.irr, 2)) + '</td><td>' + (isNaN(r.pb) ? 'never' : fmt(r.pb, 2) + ' yrs') + '</td><td>' + fmt(r.pi, 3) + '</td></tr>';
      }).join('') + '</table></div>';
    }
    function calc() {
      var raw = $('#cfIn').value.split(/[,;\s]+/).filter(function (x) { return x !== ''; });
      var cfs = raw.map(parseNum), r = parseNum($('#rIn').value) / 100, out = $('#calcOut');
      if (cfs.length < 2 || cfs.some(isNaN) || isNaN(r) || $('#rIn').value.trim() === '') { out.innerHTML = '<p class="note">Enter at least two cash flows (year 0 first) and a rate.</p>'; return; }
      var warn = cfs[0] >= 0 ? '<p class="note warn-text">Year 0 should be the cost as a negative number, for example −' + fmt(Math.abs(cfs[0]) || 1000, 0) + '.</p>' : '';
      var n = FS.npv(r, cfs), i = FS.irr(cfs), pb = FS.payback(cfs), pi = FS.profitabilityIndex(r, cfs);
      out.innerHTML = warn + '<div><span>NPV</span><b class="num">' + fmt(n, 2) + '</b></div><div><span>IRR</span><b class="num">' + (isNaN(i) ? 'n/a' : pct(i, 2)) + '</b></div><div><span>Payback</span><b class="num">' + (isNaN(pb) ? 'never' : fmt(pb, 2) + ' yrs') + '</b></div><div><span>PI</span><b class="num">' + fmt(pi, 3) + '</b></div>';
      dr.runs = dr.runs.filter(function (x) { return !(sameFlows(x.cfs, cfs) && Math.abs(x.r - r) < 1e-9); });
      dr.runs.push({ cfs: cfs, r: r, npv: n, irr: i, pb: pb, pi: pi });
      if (dr.runs.length > 12) dr.runs.shift();
      logEvent('calc', { year: yr, cfs: cfs, r: r, npv: Math.round(n * 100) / 100 });
      persist(); renderRuns();
    }
    $('#calcBtn').onclick = calc;
    $('#cfIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') calc(); });
    $('#rIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') calc(); });
    main.querySelectorAll('[data-load]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = menu.filter(function (q) { return q.id === b.dataset.load; })[0];
        $('#cfIn').value = flowsText(FS.projectCFs(p)); $('#rIn').value = '10';
        logEvent('load', { year: yr, project: p.id });
        calc(); $('#cfIn').focus();
      });
    });
    updateSummary(); renderRuns();

    // ---- review ----
    var modal = $('#reviewModal'), lastFocus = null;
    function closeModal() { modal.hidden = true; document.body.style.overflow = ''; if (lastFocus) lastFocus.focus(); }
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    modal.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
    $('#reviewBtn').onclick = function () {
      readDraft(); save();
      var why = dr.why.trim();
      if (why.length < 40) { $('#closeNote').textContent = 'Write at least a couple of sentences in your memo first — the review checks it against your choices, and the debrief depends on it.'; $('#why').focus(); return; }
      var rv = buildReview(st, yr, menu, dr);
      dr.reviews = (dr.reviews || 0) + 1; save();
      logEvent('review', { year: yr, flags: rv.flags.length });
      $('#reviewCard').innerHTML = rv.html;
      lastFocus = document.activeElement; modal.hidden = false; document.body.style.overflow = 'hidden';
      $('#backEdit').focus();
      $('#backEdit').onclick = closeModal;
      $('#confirmYear').onclick = function () {
        g.state = FS.simulateYear(st, rv.decision);
        g.rationales.push({ year: yr, text: why, flags: rv.flags.map(function (f) { return f.text; }), reviews: dr.reviews });
        logEvent('year', { year: yr, decision: rv.decision, price: g.state.price, flagsAtConfirm: rv.flags.length });
        g.draft = null; save(); closeModal(); renderCapstone(); window.scrollTo(0, 0);
      };
    };
  }

  function buildReview(st, yr, menu, dr) {
    var flags = [], memo = dr.why.toLowerCase();
    var add = function (text, kind) { flags.push({ text: text, kind: kind || 'check' }); };
    var vals = {};
    [['bonds', 'Bonds'], ['stock', 'New stock'], ['repay', 'Debt repayment'], ['dps', 'Dividend per share']].forEach(function (f) {
      var v = parseNum(dr[f[0]]);
      if (isNaN(v)) { add(f[1] + ': “' + dr[f[0]] + '” is not a number, so it will be read as 0.', 'fix'); v = 0; }
      if (v < 0) { add(f[1] + ' is negative; it will be read as 0.', 'fix'); v = 0; }
      vals[f[0]] = v;
    });
    var decision = { accept: dr.accept.slice(), finance: { bonds: vals.bonds, stock: vals.stock, repay: vals.repay }, credit: dr.credit, inventory: dr.inventory, dps: vals.dps };
    var chosen = menu.filter(function (p) { return dr.accept.indexOf(p.id) >= 0; });
    var cost = chosen.reduce(function (a, p) { return a + p.cost; }, 0);
    var inflow = st.cash + vals.bonds + vals.stock;
    var repayEff = Math.min(vals.repay, st.ltd, Math.max(0, inflow));
    var after = inflow - repayEff - cost;
    var newShares = vals.stock > 0 ? vals.stock / (st.price * 0.95) : 0;
    var divCash = vals.dps * (st.shares + newShares);
    var runFor = function (p) { var cfs = FS.projectCFs(p); return dr.runs.filter(function (r) { return Math.abs(r.r - 0.10) < 1e-9 && sameFlows(r.cfs, cfs); })[0]; };

    // cash and financing
    if (vals.repay > repayEff + 0.5) add('You asked to repay ' + k(vals.repay) + ' of debt, but only ' + k(repayEff) + ' can be repaid from the cash and debt you have. The repayment will be capped.');
    if (after < 0) add('Projects and repayments cost ' + k(-after) + ' more than the cash you will have. The bank will lend that at ' + pct(st.rate + 0.03) + ', more than new bonds would cost (' + pct(st.rate) + ').');
    else if (after < 300) add('Only ' + k(after) + ' of cash is left after projects, and dividends of about ' + k(divCash) + ' are due at year-end. A slow year could still push you onto the emergency bank line.');
    if (vals.bonds > 0 && vals.repay > 0) add('You are issuing new bonds and repaying old debt in the same year. Make sure that is intended.');
    if (vals.dps > 0 && st.history.length && vals.dps > st.history[st.history.length - 1].eps) add('The dividend of ' + money(vals.dps, 2) + ' a share is more than last year’s EPS of ' + money(st.history[st.history.length - 1].eps, 2) + '. You would be paying out more than the firm earned.');

    // projects vs the student's own calculations
    menu.forEach(function (p) {
      var r = runFor(p), took = dr.accept.indexOf(p.id) >= 0;
      if (took && !r) add('You accepted ' + p.id + ' ' + p.name + ' without running it through the calculator at 10%.');
      if (r && took && r.npv < 0) add('Your own calculation shows an NPV of ' + fmt(r.npv, 2) + ' for ' + p.id + ' ' + p.name + ', but you accepted it.');
      if (r && !took && r.npv > 0) add('Your own calculation shows a positive NPV (' + fmt(r.npv, 2) + ') for ' + p.id + ' ' + p.name + ', but you declined it. If that was a financing choice, say so in your memo.');
    });

    // memo vs choices (keyword checks)
    var mentions = function (p) { return memo.indexOf(p.id.toLowerCase()) >= 0 || (PKEYS[p.id] || []).some(function (w) { return memo.indexOf(w) >= 0; }); };
    menu.forEach(function (p) {
      var took = dr.accept.indexOf(p.id) >= 0;
      if (took && !mentions(p)) add('You accepted ' + p.id + ' ' + p.name + ', but your memo does not mention it.');
      if (!took && mentions(p) && !/(declin|reject|pass|skip|not (take|accept|do|pursue)|turn(ed)? down|negative npv)/.test(memo)) add('Your memo mentions ' + p.name + ', which you have not selected.');
    });
    var bondWords = /\bbonds?\b|borrow/.test(memo);
    if (vals.bonds > 0 && !/\bbonds?\b|borrow|debt/.test(memo)) add('You are issuing ' + k(vals.bonds) + ' of bonds, but your memo does not explain the borrowing.');
    if (vals.bonds === 0 && bondWords && !/no (new )?(bonds?|borrowing)|not (issue|issuing|borrow)|without (bonds?|borrowing)/.test(memo)) add('Your memo mentions bonds or borrowing, but the bond amount is 0.');
    var stockWords = /(issu\w*|sell\w*|rais\w*)\s+(\w+\s+)?(new\s+)?(stock|shares|equity)|new (stock|shares|equity)|equity (issue|financing)/.test(memo);
    if (vals.stock > 0 && !/stock|shares|equity/.test(memo)) add('You are issuing ' + k(vals.stock) + ' of new stock, but your memo does not explain it.');
    if (vals.stock === 0 && stockWords && !/no new (stock|shares|equity)|not (issue|issuing|sell)/.test(memo)) add('Your memo talks about issuing stock, but the new-stock amount is 0.');
    var repayWords = /repay|pay (down|off)|retire/.test(memo);
    if (vals.repay > 0 && !repayWords) add('You are repaying ' + k(vals.repay) + ' of debt, but your memo does not mention it.');
    if (vals.repay === 0 && repayWords && !/not (repay|pay)|no repay/.test(memo)) add('Your memo mentions repaying debt, but the repayment amount is 0.');
    var net = memo.match(/net[\s-]?(30|45|60)/);
    if (net && 'net' + net[1] !== dr.credit) add('Your memo mentions net ' + net[1] + ', but credit terms are set to ' + FS.CAP.credit[dr.credit].label + '.');
    if (/\blean\b/.test(memo) && dr.inventory !== 'lean') add('Your memo mentions lean inventory, but inventory policy is set to ' + FS.CAP.inventory[dr.inventory].label + '.');
    if (/\bheavy\b|stock up|build (up )?inventory/.test(memo) && dr.inventory !== 'heavy') add('Your memo mentions building inventory, but inventory policy is set to ' + FS.CAP.inventory[dr.inventory].label + '.');
    var dm = memo.match(/dividend[^.\n]{0,40}?\$\s?(\d+(?:\.\d+)?)/) || memo.match(/\$\s?(\d+(?:\.\d+)?)[^.\n$]{0,25}dividend/);
    if (dm && parseFloat(dm[1]) < 20 && Math.abs(parseFloat(dm[1]) - vals.dps) > 0.005) add('Your memo mentions a dividend of $' + dm[1] + ', but the dividend is set to ' + money(vals.dps, 2) + ' a share.');
    if (/(cut|suspend|eliminat\w*|skip|no|zero|stop\w*) (the |our |any )?dividends?|dividends? (to|of) (zero|\$0(\.00)?\b)/.test(memo) && vals.dps > 0) add('Your memo suggests cutting or skipping the dividend, but it is set to ' + money(vals.dps, 2) + ' a share.');

    // ---- markup ----
    var h = '<div class="kicker">Year ' + yr + ' · ' + esc(FS.CAP.events[yr - 1].title) + '</div><h2 id="reviewTitle">Review before you close the books</h2><p class="note">This is exactly what will be submitted. Go back to change anything; nothing happens until you confirm.</p>';
    h += '<h4>Projects</h4><div class="wide"><table class="fin"><tr><th>Proposal</th><td>Decision</td><td>Cost</td><td>Your NPV at 10%</td></tr>' + menu.map(function (p) {
      var r = runFor(p), took = dr.accept.indexOf(p.id) >= 0;

      ll('Cash on hand now', st.cash) + (vals.bonds ? ll('+ New bonds at ' + pct(st.rate), vals.bonds) : '') + (vals.stock ? ll('+ New stock (≈' + fmt(newShares, 0) + 'K shares)', vals.stock) : '') + (repayEff ? ll('− Debt repaid', -repayEff) : '') + (cost ? ll('− Projects accepted', -cost) : '') +
      '<div class="ledger-line tot' + (after < 0 ? ' neg' : '') + '"><span>Cash after these choices</span><b>' + (after < 0 ? '(' + fmt(-after, 0) + ')' : fmt(after, 0)) + '</b></div></div>' +
      '<p class="note">Dividends due at year-end: ' + money(vals.dps, 2) + ' × ' + fmt(st.shares + newShares, 0) + 'K shares ≈ <b>' + k(divCash) + '</b>, paid from this cash plus the year’s operating cash flow.</p>';

    h += '<h4>Your memo</h4><div class="memo-quote">' + esc(dr.why.trim()) + '</div>';

    } else h += '<ul class="checks"><li><span class="badge good">OK</span><span>Your memo and your choices line up, and the cash plan covers what you accepted.</span></li></ul>';
    h += '<div class="actions"><button class="btn" id="backEdit">Back to edit</button><button class="btn primary" id="confirmYear">Confirm and close Year ' + yr + '</button></div>';

  }
  function tile(label, value, sub, cls) { return '<div class="stat ' + (cls || '') + '"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div><div class="stat-sub">' + sub + '</div></div>'; }

  // ---------- benchmark: do nothing, standard policies, $0.50 dividend ----------
  function benchmark() {

  }

      '</table></div></div>';

    // decision log
    html += '<div class="panel"><h3>Your decisions and reasoning</h3><div class="log">';
    hist.forEach(function (h, i) {

    });
    html += '</div></div>';

    // reflection & report
    html += '<div class="panel reflect"><h3>Looking back</h3><p class="note">Where did your reasoning hold up, and where did the results surprise you? Which decision would you change, and which criterion (NPV, IRR, payback, a ratio) would you rely on more next time?</p><textarea id="gRefl">' + esc(g.reflection) + '</textarea><div class="actions"><button class="btn primary" id="saveG">Save</button><span class="note" id="gNote">' + (g.reflection ? 'Saved.' : '') + '</span></div></div>';
    html += '<div class="panel"><h3>Report for submission</h3><p class="note">Copy this into your Canvas submission or a document. It contains everything above in plain text.</p><div class="actions" style="margin:0 0 .6rem"><button class="btn primary" id="copyRep">Copy report</button><button class="btn" id="printRep">Print</button><span class="note" id="copyNote"></span></div><textarea class="report" id="report" readonly>' + esc(buildReport(bm)) + '</textarea></div>';
    main.innerHTML = html;
    $('#saveG').onclick = function () { g.reflection = $('#gRefl').value; save(); $('#gNote').textContent = 'Saved.'; $('#report').value = buildReport(bm); };
    $('#copyRep').onclick = function () {
      var ta = $('#report'); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { }
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function () { $('#copyNote').textContent = 'Copied.'; }, function () { $('#copyNote').textContent = ok ? 'Copied.' : 'Select the text and copy it manually.'; });
      else $('#copyNote').textContent = ok ? 'Copied.' : 'Select the text and copy it manually.';
    };
    $('#printRep').onclick = function () { window.print(); };
    wireTips();
  }
  function trow(l, hist, f) { return '<tr><th>' + l + '</th>' + hist.map(function (h) { return '<td>' + f(h) + '</td>'; }).join('') + '</tr>'; }

  function buildReport(bm) {
    var g = state.game, st = g.state, hist = st.history, L = [];
    L.push('RIDGELINE FINANCE LAB — REPORT'); L.push('Student: ' + (state.name || '(no name entered)')); L.push('Generated: ' + new Date().toLocaleString()); L.push('');
    L.push('GUIDED SCENARIOS');
    SC.forEach(function (s) {
      var p = state.scenarios[s.id];
      var first = state.log.filter(function (e) { return e.kind === 'check' && e.detail.scenario === s.id; })[0];
      var fin = p ? s.questions.filter(function (q) { return p.results[q.id] === true; }).length : 0;
      var mc = p ? s.mcq.filter(function (m) { return p.mcq[m.id] === m.correct; }).length : 0;
      L.push(s.ch + ' ' + s.title + ' — attempts ' + (p ? p.attempts : 0) + (s.questions.length ? ', first check ' + (first ? first.detail.correct : 0) + '/' + s.questions.length + ', final ' + fin + '/' + s.questions.length : '') + (s.mcq.length ? ', concepts ' + mc + '/' + s.mcq.length : '') + ', solution shown: ' + (p && p.solutionViewed ? 'yes' : 'no') + ', decision: ' + (p && p.decision != null ? (s.decision.options[p.decision].correct ? 'sound' : 'revisit') : 'none'));
      if (p && p.reflection) L.push('   Reflection: ' + p.reflection.replace(/\s+/g, ' '));
    });
    L.push('');
    if (hist.length) {
      var last = hist[hist.length - 1], bmh = bm.history[hist.length - 1], sc = FS.finalScore(st);
      L.push('CAPSTONE: RIDGELINE OUTFITTERS (' + hist.length + ' of 5 years)');
      L.push('Opening price $' + st.openingPrice.toFixed(2) + ' -> ending price $' + last.price.toFixed(2) + '; dividends $' + last.cumDiv.toFixed(2) + '/share; total return ' + pct(last.tsr) + ' vs do-nothing benchmark ' + pct(bmh.tsr));
      L.push('NPV of accepted projects $' + fmt(sc.valueCreated, 0) + 'K of $' + fmt(sc.menuValue, 0) + 'K available');
      hist.forEach(function (h, i) {
        var d = h.decision, r = g.rationales[i];
        L.push(''); L.push('Year ' + h.year + ' (' + h.event + '): accepted ' + (h.accepted.length ? h.accepted.join(', ') : 'none') + '; bonds ' + fmt(d.finance.bonds || 0, 0) + 'K; stock ' + fmt(d.finance.stock || 0, 0) + 'K; repaid ' + fmt(d.finance.repay || 0, 0) + 'K; ' + FS.CAP.credit[d.credit].label + '; ' + FS.CAP.inventory[d.inventory].label + '; DPS $' + d.dps.toFixed(2));
        L.push('   Results: sales ' + fmt(h.sales, 0) + 'K, NI ' + fmt(h.ni, 0) + 'K, EPS $' + h.eps.toFixed(2) + ', cash ' + fmt(h.cash, 0) + 'K, LTD ' + fmt(h.ltd, 0) + 'K, CR ' + h.curRatio.toFixed(2) + ', D/E ' + h.de.toFixed(2) + ', TIE ' + h.tie.toFixed(1) + ', ROE ' + pct(h.roe) + ', price $' + h.price.toFixed(2) + (h.notes.length ? ' | ' + h.notes.join(' ') : ''));
        FS.CAP.projects[h.year].forEach(function (p) { var s = FS.projectStats(p, 0.10); L.push('   ' + p.id + ' ' + p.name + ': NPV ' + fmt(s.npv, 0) + 'K, IRR ' + pct(s.irr) + ' — ' + (h.accepted.indexOf(p.id) >= 0 ? 'ACCEPTED' : 'declined')); });
        if (r) L.push('   Reasoning: ' + r.text.replace(/\s+/g, ' '));
        if (r && r.reviews != null) L.push('   Review: ' + r.reviews + ' review(s); checks at confirmation: ' + (r.flags && r.flags.length ? r.flags.join(' | ') : 'none'));
      });
      if (g.reflection) { L.push(''); L.push('Looking back: ' + g.reflection.replace(/\s+/g, ' ')); }
    }
    L.push(''); L.push('ACTIVITY LOG (' + state.log.length + ' events)');
    state.log.forEach(function (e) { L.push(e.t.slice(0, 16).replace('T', ' ') + '  ' + e.kind + '  ' + JSON.stringify(e.detail)); });
    return L.join('\n');
  }

  // ---------- charts (inline SVG) ----------
  function lineChart(series, labels, unit) {
    var W = 520, H = 260, m = { t: 16, r: 16, b: 32, l: 48 };
    var all = series.reduce(function (a, s) { return a.concat(s.pts); }, []);
    var lo = 0, hi = Math.max.apply(null, all) * 1.12 || 1;
    var step = niceStep(hi / 4); hi = Math.ceil(hi / step) * step;
    var n = labels.length, x = function (i) { return m.l + (W - m.l - m.r) * (n === 1 ? 0 : i / (n - 1)); }, y = function (v) { return m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo)); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Share price by year"><g class="grid">';
    for (var v = lo; v <= hi + 1e-9; v += step) svg += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
    svg += '</g><g class="axis">';
    for (v = lo; v <= hi + 1e-9; v += step) svg += '<text x="' + (m.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + (unit === '$' ? '$' : '') + fmt(v, 0) + '</text>';
    labels.forEach(function (l, i) { svg += '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + l + '</text>'; });
    svg += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(lo) + '" y2="' + y(lo) + '"/></g>';
    series.forEach(function (s) {
      svg += '<polyline class="' + s.cls + '" fill="none" stroke-width="2" stroke-linejoin="round" points="' + s.pts.map(function (p, i) { return x(i) + ',' + y(p); }).join(' ') + '"/>';
      s.pts.forEach(function (p, i) { svg += '<circle class="' + s.cls + 'f" cx="' + x(i) + '" cy="' + y(p) + '" r="' + (i === s.pts.length - 1 ? 5 : 3.5) + '" stroke="var(--paper-2)" stroke-width="2"/>'; });
      var lastP = s.pts[s.pts.length - 1];
      svg += '<text class="lbl" x="' + (x(s.pts.length - 1) - 8) + '" y="' + (y(lastP) - 9) + '" text-anchor="end">$' + fmt(lastP, 2) + '</text>';
    });
    labels.forEach(function (l, i) { svg += '<rect class="hit" x="' + (x(i) - 18) + '" y="' + m.t + '" width="36" height="' + (H - m.t - m.b) + '" data-tip="' + l + ': ' + series.map(function (s) { return '$' + fmt(s.pts[i], 2); }).join(' vs ') + '" data-x="' + x(i) + '" data-y="' + y(Math.max.apply(null, series.map(function (s) { return s.pts[i]; }))) + '"/>'; });
    return '<div class="chart">' + svg + '</svg><div class="tip"></div></div>';
  }
  function barChart(rows) {
    var W = 520, H = 260, m = { t: 16, r: 16, b: 32, l: 52 };
    var vals = rows.reduce(function (a, r) { return a.concat([r.v, r.avail]); }, [0]);
    var hi = Math.max.apply(null, vals) * 1.15 || 1, lo = Math.min.apply(null, vals) * 1.15;
    if (lo > 0) lo = 0;
    var step = niceStep((hi - lo) / 4); hi = Math.ceil(hi / step) * step; lo = Math.floor(lo / step) * step;
    var n = rows.length, bw = (W - m.l - m.r) / n, y = function (v) { return m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo)); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="NPV of accepted projects by year"><g class="grid">';
    for (var v = lo; v <= hi + 1e-9; v += step) svg += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
    svg += '</g><g class="axis">';
    for (v = lo; v <= hi + 1e-9; v += step) svg += '<text x="' + (m.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + fmt(v, 0) + '</text>';
    rows.forEach(function (r, i) {
      var cx = m.l + bw * (i + 0.5), w = Math.min(44, bw * 0.5);
      svg += '<text x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + r.label + '</text>';
      svg += '<rect class="bar-avail" x="' + (cx - w / 2 - 4) + '" y="' + y(r.avail) + '" width="' + (w + 8) + '" height="' + Math.max(0, y(0) - y(r.avail)) + '"/>';
      var top = Math.min(y(0), y(r.v)), h = Math.abs(y(0) - y(r.v));
      svg += '<rect class="' + (r.v >= 0 ? 'bar-pos' : 'bar-neg') + '" x="' + (cx - w / 2) + '" y="' + top + '" width="' + w + '" height="' + h + '" rx="2"/>';
      svg += '<text class="lbl" x="' + cx + '" y="' + (r.v >= 0 ? top - 5 : top + h + 13) + '" text-anchor="middle">' + fmt(r.v, 0) + '</text>';
      svg += '<rect class="hit" x="' + (cx - bw / 2) + '" y="' + m.t + '" width="' + bw + '" height="' + (H - m.t - m.b) + '" data-tip="' + r.label + ': took ' + fmt(r.v, 0) + 'K of ' + fmt(r.avail, 0) + 'K available" data-x="' + cx + '" data-y="' + Math.min(top, y(r.avail)) + '"/>';
    });
    svg += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(0) + '" y2="' + y(0) + '"/></g>';
    return '<div class="chart">' + svg + '</svg><div class="tip"></div></div>';
  }
  function niceStep(raw) { var p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
  function wireTips() {
    main.querySelectorAll('.chart').forEach(function (ch) {
      var tip = $('.tip', ch), svg = $('svg', ch);
      ch.querySelectorAll('.hit').forEach(function (h) {
        h.addEventListener('mouseenter', function () {
          var r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, sx = r.width / vb.width, sy = r.height / vb.height;
          tip.textContent = h.dataset.tip; tip.style.left = (h.dataset.x * sx) + 'px'; tip.style.top = (h.dataset.y * sy) + 'px'; tip.style.display = 'block';
        });
        h.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
      });
    });
  }

  render();
})();


</script>

<script>
// ── Firebase + Room Code ──
var FB_CONFIG = {
  apiKey: "AIzaSyCjgraSUtveFYRO50qDSuUVCmb42zDlxnU",
  authDomain: "my-project-1577995916726.firebaseapp.com",
  databaseURL: "https://my-project-1577995916726-default-rtdb.firebaseio.com",
  projectId: "my-project-1577995916726",
  storageBucket: "my-project-1577995916726.firebasestorage.app",
  messagingSenderId: "503294518028",
  appId: "1:503294518028:web:4e02ab026749c92c381f29"
};

window._fbDb = null;
window._roomCode = null;

function loadFirebase(callback) {
  var s1 = document.createElement('script');
  s1.src = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js';
  s1.onload = function() {
    var s2 = document.createElement('script');
    s2.src = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js';
    s2.onload = function() {
      try {
        firebase.initializeApp(FB_CONFIG);
        window._fbDb = firebase.database();
        callback(true);
      } catch(e) { callback(false, e); }
    };
    s2.onerror = function() { callback(false, 'DB SDK failed'); };
    document.head.appendChild(s2);
  };
  s1.onerror = function() { callback(false, 'App SDK failed'); };
  document.head.appendChild(s1);
}

function setRoomStatus(msg, type) {
  var el = document.getElementById('roomStatus');
  if (!el) return;
  el.textContent = msg;
  el.style.color = type === 'err' ? '#f87171' : '#4ade80';
}

function joinRoom() {
  var raw = document.getElementById('roomCodeInput').value.trim().toUpperCase();
  if (!raw || raw.length < 2) { setRoomStatus('Please enter a room code', 'err'); return; }
  var code = raw.replace(/[^A-Z0-9\-]/g, '');
  if (!code) { setRoomStatus('Letters, numbers and hyphens only', 'err'); return; }

  var btn = document.getElementById('joinRoomBtn');
  if (btn) btn.disabled = true;
  setRoomStatus('Connecting...', '');

  loadFirebase(function(ok, err) {
    if (!ok) {
      if (btn) btn.disabled = false;
      setRoomStatus('Connection error — check your internet', 'err');
      console.error('Firebase error:', err);
      return;
    }
    window._roomCode = code;
    try { localStorage.setItem('corpsim_room', code); } catch(e) {}

    var ref = window._fbDb.ref('corpsim/' + code + '/state');
    ref.once('value', function(snap) {
      var data = snap.val();
      if (data && data.game && data.game.state) {
        state = data;
        if (typeof render === 'function') render();
        setRoomStatus('Room loaded — syncing with partner', '');
      } else {
        pushToFirebase();
        setRoomStatus('New room created', '');
      }
      // Live sync
      ref.on('value', function(s) {
        var d = s.val();
        if (d && d.game && d.game.state && JSON.stringify(d) !== JSON.stringify(state)) {
          state = d;
          if (typeof render === 'function') render();
        }
      });
      document.getElementById('roomOverlay').style.display = 'none';
    }, function(e) {
      if (btn) btn.disabled = false;
      setRoomStatus('Error: ' + e.message, 'err');
    });
  });
}

function pushToFirebase() {
  if (!window._fbDb || !window._roomCode) return;
  window._fbDb.ref('corpsim/' + window._roomCode + '/state').set(state).catch(function(){});
}

// Auto-fill saved room code
(function() {
  var saved = '';
  try { saved = localStorage.getItem('corpsim_room') || ''; } catch(e) {}
  if (saved) { var el = document.getElementById('roomCodeInput'); if (el) el.value = saved; }
})();
).value = saved;
  }
})();
</script>
